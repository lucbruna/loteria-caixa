<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados - Loteria Federal IA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .background {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at 20% 50%, rgba(0, 212, 170, 0.08) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 20%, rgba(0, 100, 255, 0.06) 0%, transparent 50%);
            z-index: -1;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header {
            display: flex; align-items: center; gap: 15px; margin-bottom: 30px;
            padding: 20px; background: rgba(255,255,255,0.03);
            border-radius: 12px; border: 1px solid rgba(255,255,255,0.06);
            flex-wrap: wrap;
        }
        .header h1 { font-size: 1.4em; color: #00d4aa; flex: 1; min-width: 200px; }
        .voltar {
            background: rgba(255,255,255,0.08); color: #ccc; border: none;
            padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.9em;
            transition: all 0.2s; text-decoration: none;
        }
        .voltar:hover { background: rgba(255,255,255,0.15); color: #fff; }
        .btn-verificar {
            background: linear-gradient(135deg, #00d4aa, #0099cc);
            color: #000; border: none; padding: 10px 20px; border-radius: 8px;
            cursor: pointer; font-weight: 600; font-size: 0.9em;
            transition: all 0.3s;
        }
        .btn-verificar:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,212,170,0.3); }
        .btn-verificar:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 25px; }
        .stat-card {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px; padding: 16px; text-align: center;
        }
        .stat-card .valor { font-size: 1.8em; font-weight: 700; color: #00d4aa; }
        .stat-card .label { font-size: 0.8em; color: #888; margin-top: 4px; }
        .stat-card .icone { font-size: 1.3em; margin-bottom: 6px; color: #00d4aa; }

        .loteria-section { margin-bottom: 30px; }
        .loteria-header {
            display: flex; align-items: center; gap: 10px; margin-bottom: 15px;
            padding: 12px 16px; background: rgba(255,255,255,0.03);
            border-radius: 10px; border-left: 4px solid var(--cor, #00d4aa);
            cursor: pointer; transition: background 0.2s;
        }
        .loteria-header:hover { background: rgba(255,255,255,0.06); }
        .loteria-header .icon { font-size: 1.5em; }
        .loteria-header .nome { font-weight: 600; flex: 1; }
        .loteria-header .badge {
            padding: 3px 10px; border-radius: 20px; font-size: 0.8em; font-weight: 600;
        }
        .badge-ok { background: rgba(0,212,170,0.2); color: #00d4aa; }
        .badge-pendente { background: rgba(255,193,7,0.2); color: #ffc107; }
        .badge-vazia { background: rgba(255,255,255,0.05); color: #666; }

        .concurso-group { margin-bottom: 20px; }
        .concurso-title {
            padding: 10px 14px; background: rgba(255,255,255,0.04);
            border-radius: 8px; font-weight: 600; font-size: 0.9em;
            border-left: 3px solid #00d4aa; margin-bottom: 10px;
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        }
        .concurso-title .sorteio {
            font-family: 'Courier New', monospace;
            display: flex; gap: 3px; align-items: center;
        }
        .concurso-title .sorteio span {
            display: inline-block; width: 26px; height: 26px; line-height: 26px;
            text-align: center; border-radius: 50%; font-size: 0.75em;
            background: rgba(255,193,7,0.25); color: #ffc107; font-weight: 700;
        }

        .jogo-card {
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px; padding: 14px; margin-bottom: 10px;
            transition: background 0.2s;
        }
        .jogo-card:hover { background: rgba(255,255,255,0.04); }
        .jogo-header {
            display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap;
        }
        .jogo-id {
            font-family: 'Courier New', monospace; font-size: 0.75em;
            color: #888; background: rgba(255,255,255,0.05);
            padding: 2px 8px; border-radius: 4px;
        }
        .jogo-data { font-size: 0.75em; color: #666; }
        .jogo-conf {
            font-size: 0.75em; padding: 2px 8px; border-radius: 4px;
            background: rgba(0,212,170,0.15); color: #00d4aa;
        }
        .fonte-badge {
            padding: 2px 8px; border-radius: 4px; font-size: 0.75em; font-weight: 600;
        }
        .fonte-IA { background: rgba(0,212,170,0.2); color: #00d4aa; }
        .fonte-Ultra { background: rgba(156,39,176,0.2); color: #ce93d8; }
        .fonte-Global { background: rgba(33,150,243,0.2); color: #90caf9; }
        .fonte-Combinacoes { background: rgba(255,152,0,0.2); color: #ffb74d; }
        .fonte-Inteligente { background: rgba(233,30,99,0.2); color: #f48fb1; }

        .numeros-row { margin-bottom: 8px; }
        .numeros-label { font-size: 0.7em; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .numeros-list {
            font-family: 'Courier New', monospace; display: flex; gap: 3px; flex-wrap: wrap;
        }
        .numeros-list span {
            display: inline-block; min-width: 28px; height: 28px; line-height: 28px;
            text-align: center; border-radius: 50%; font-size: 0.8em; font-weight: 600;
        }
        .num-acerto { background: rgba(0,212,170,0.3); color: #00d4aa; border: 1px solid rgba(0,212,170,0.5); }
        .num-erro { background: rgba(255,107,107,0.15); color: #ff6b6b; border: 1px solid rgba(255,107,107,0.3); }
        .num-drawn { background: rgba(255,193,7,0.25); color: #ffc107; border: 1px solid rgba(255,193,7,0.4); }
        .num-nao-drawn { background: rgba(255,255,255,0.03); color: #555; border: 1px solid rgba(255,255,255,0.05); }

        .resultado-acertos {
            display: flex; align-items: center; gap: 8px; margin-top: 6px;
        }
        .acerto-count {
            font-size: 1.2em; font-weight: 700;
            padding: 4px 12px; border-radius: 8px;
        }
        .acerto-15, .acerto-11, .acerto-12, .acerto-13, .acerto-14 {
            background: rgba(0,212,170,0.25); color: #00d4aa;
        }
        .acerto-10, .acerto-9, .acerto-8 {
            background: rgba(0,212,170,0.15); color: #00d4aa;
        }
        .acerto-7, .acerto-6 {
            background: rgba(255,193,7,0.2); color: #ffc107;
        }
        .acerto-5, .acerto-4, .acerto-3 {
            background: rgba(255,152,0,0.15); color: #ffb74d;
        }
        .acerto-2, .acerto-1, .acerto-0 {
            background: rgba(255,107,107,0.15); color: #ff6b6b;
        }
        .acerto-label { font-size: 0.8em; color: #888; }

        .pendente-label {
            font-size: 0.85em; color: #ffc107; padding: 4px 10px;
            background: rgba(255,193,7,0.1); border-radius: 6px;
        }

        .vazio {
            text-align: center; padding: 60px 20px; color: #666;
        }
        .vazio i { font-size: 3em; margin-bottom: 15px; color: #333; }
        .loading {
            text-align: center; padding: 40px; color: #888;
        }
        .loading i { font-size: 2em; animation: spin 1s linear infinite; color: #00d4aa; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .legenda {
            display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px;
            padding: 10px 14px; background: rgba(255,255,255,0.03);
            border-radius: 8px; font-size: 0.8em;
        }
        .legenda-item { display: flex; align-items: center; gap: 6px; }
        .legenda-dot {
            width: 12px; height: 12px; border-radius: 50%;
        }

        @media (max-width: 768px) {
            .container { padding: 10px; }
            .header { padding: 12px; gap: 8px; }
            .header h1 { font-size: 1.1em; }
            .stat-card .valor { font-size: 1.4em; }
            .numeros-list span { min-width: 24px; height: 24px; line-height: 24px; font-size: 0.7em; }
            .concurso-title .sorteio span { width: 22px; height: 22px; line-height: 22px; font-size: 0.65em; }
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-chart-line"></i> Resultados das Predicoes</h1>
            <button class="btn-verificar" onclick="verificarAgora()">
                <i class="fas fa-sync-alt"></i> Verificar Agora
            </button>
            <a href="/" class="voltar"><i class="fas fa-arrow-left"></i> Voltar</a>
        </div>

        <div class="legenda">
            <div class="legenda-item"><div class="legenda-dot" style="background:rgba(0,212,170,0.5)"></div> Acertou</div>
            <div class="legenda-item"><div class="legenda-dot" style="background:rgba(255,107,107,0.5)"></div> Errou</div>
            <div class="legenda-item"><div class="legenda-dot" style="background:rgba(255,193,7,0.4)"></div> Numero Sorteado</div>
        </div>

        <div id="stats-gerais" class="stats-grid"></div>
        <div id="conteudo"><div class="loading"><i class="fas fa-spinner"></i><br>Carregando...</div></div>
    </div>

    <script>
    const NOMES = { megasena:'Mega-Sena', lotofacil:'Lotofácil', lotomania:'Lotomania', quina:'Quina', loteca:'Loteca', timemania:'Timemania', diadesorte:'Dia de Sorte' };
    const ICONS = { megasena:'🎰', lotofacil:'🎯', lotomania:'🍀', quina:'⭐', loteca:'⚽', timemania:'🎮', diadesorte:'📅' };
    const COLORS = { megasena:'#00A859', lotofacil:'#9B59B6', lotomania:'#E74C3C', quina:'#3498DB', loteca:'#F39C12', timemania:'#1ABC9C', diadesorte:'#E67E22' };

    async function carregar() {
        try {
            const [preds, stats] = await Promise.all([
                fetch('/api/predicoes/todas').then(r => r.json()),
                fetch('/api/estatisticas-predicoes').then(r => r.json()),
            ]);
            renderStats(stats);
            renderLoterias(preds, stats);
        } catch(e) {
            document.getElementById('conteudo').innerHTML =
                '<div class="vazio"><i class="fas fa-exclamation-triangle"></i><br>Erro ao carregar dados: ' + e.message + '</div>';
        }
    }

    function renderStats(stats) {
        let total = 0, verificadas = 0, totalAcertos = 0, qtdAcertos = 0, maxAcertos = 0;
        for (const s of Object.values(stats)) {
            total += s.total || 0;
            verificadas += s.verificadas || 0;
            if (s.media_acertos > 0) { totalAcertos += s.media_acertos * s.verificadas; qtdAcertos += s.verificadas; }
            if ((s.max_acertos || 0) > maxAcertos) maxAcertos = s.max_acertos;
        }
        const media = qtdAcertos ? (totalAcertos / qtdAcertos) : 0;
        document.getElementById('stats-gerais').innerHTML = `
            <div class="stat-card"><div class="icone"><i class="fas fa-ticket-alt"></i></div>
                <div class="valor">${total}</div><div class="label">Total de Jogos</div></div>
            <div class="stat-card"><div class="icone"><i class="fas fa-check-circle"></i></div>
                <div class="valor">${verificadas}</div><div class="label">Verificados</div></div>
            <div class="stat-card"><div class="icone"><i class="fas fa-hourglass-half"></i></div>
                <div class="valor">${total - verificadas}</div><div class="label">Pendentes</div></div>
            <div class="stat-card"><div class="icone"><i class="fas fa-star"></i></div>
                <div class="valor">${media.toFixed(1)}</div><div class="label">Media Acertos</div></div>
            <div class="stat-card"><div class="icone"><i class="fas fa-trophy"></i></div>
                <div class="valor">${maxAcertos}</div><div class="label">Max Acertos</div></div>
        `;
    }

    function renderLoterias(preds, stats) {
        const container = document.getElementById('conteudo');
        const loterias = Object.keys(preds);
        if (!loterias.length) {
            container.innerHTML = '<div class="vazio"><i class="fas fa-inbox"></i><br>Nenhum jogo salvo ainda.<br>Gere jogos na analise para aparecerem aqui.</div>';
            return;
        }

        let html = '';
        for (const chave of loterias) {
            const lista = preds[chave]?.predicoes || [];
            const s = stats[chave] || {};
            const cor = COLORS[chave] || '#00d4aa';
            const nome = NOMES[chave] || chave;
            const icon = ICONS[chave] || '🎲';
            const pendentes = (s.total || 0) - (s.verificadas || 0);

            html += `<div class="loteria-section">`;
            html += `<div class="loteria-header" style="--cor:${cor}" onclick="toggleSection('sec-${chave}')">
                <span class="icon">${icon}</span>
                <span class="nome">${nome}</span>
                <span class="badge badge-ok">${s.verificadas || 0} verificados</span>
                ${pendentes > 0 ? '<span class="badge badge-pendente">' + pendentes + ' pendentes</span>' : ''}
                <span style="color:#666;font-size:0.8em">${lista.length} jogos</span>
            </div>`;
            html += `<div id="sec-${chave}">`;

            if (!lista.length) {
                html += '<div class="vazio" style="padding:30px"><i class="fas fa-inbox"></i><br>Nenhum jogo</div>';
            } else {
                const verificados = lista.filter(p => (p.verificacoes || []).length > 0);
                const pendentesLista = lista.filter(p => !(p.verificacoes || []).length);

                html += `<div class="legenda" style="margin-top:10px;margin-bottom:15px;padding:8px 12px;font-size:0.75em">
                    <strong>Separação por tipo:</strong> IA | Ultra | Global | Combinacoes | Inteligente — cada tipo mostrado separadamente com seus acertos e erros.
                </div>`;

                const gruposPorFonte = {};
                for (const p of verificados) {
                    const fonte = p.fonte || 'Outro';
                    if (!gruposPorFonte[fonte]) gruposPorFonte[fonte] = [];
                    for (const v of (p.verificacoes || [])) {
                        gruposPorFonte[fonte].push({ ...p, verificacao: v });
                    }
                }

                for (const [fonte, jogos] of Object.entries(gruposPorFonte)) {
                    const fonteCls = 'fonte-' + fonte.replace(/\s+/g, '');
                    html += `<div class="concurso-group">
                        <div class="concurso-title" style="border-left-color: var(--cor, #a855f7)">
                            <span><span class="fonte-badge ${fonteCls}">${fonte}</span></span>
                            <span style="color:#888;font-size:0.85em">${jogos.length} jogo(s)</span>
                        </div>`;

                    const concursos = {};
                    for (const j of jogos) {
                        const c = j.verificacao.concurso;
                        if (!concursos[c]) concursos[c] = { sorteio: j.verificacao.numeros_sorteados || [], jogos: [] };
                        concursos[c].jogos.push(j);
                    }

                    for (const [numConc, info] of Object.entries(concursos)) {
                        html += `<div class="concurso-group">
                            <div class="concurso-title" style="border-left-color:#00d4aa">
                                <span><i class="fas fa-dice"></i> Concurso #${numConc}</span>
                                <span style="color:#888;font-size:0.85em">Sorteio:</span>
                                <span class="sorteio">${info.sorteio.map(n => '<span>' + String(n).padStart(2, '0') + '</span>').join('')}</span>
                                <span style="color:#666;font-size:0.85em">${info.jogos.length} jogo(s)</span>
                            </div>`;

                        for (const jogo of info.jogos) {
                            const nums = jogo.numeros || [];
                            const v = jogo.verificacao;
                            const acertos = v.acertos || 0;
                            const acertados = v.numeros_acertados || [];
                            const errados = v.numeros_errados || [];
                            const sorteioSet = new Set(info.sorteio);
                            const numsSet = new Set(nums);

                            const conf = typeof jogo.confianca === 'number' ? jogo.confianca.toFixed(1) : (jogo.confianca || '—');
                            const data = new Date(jogo.data).toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
                            const id = jogo.id || '—';
                            const estr = jogo.estrategia || '';

                            html += `<div class="jogo-card">`;
                            html += `<div class="jogo-header">
                                <span class="jogo-id">#${id}</span>
                                <span class="fonte-badge ${fonteCls}">${fonte}</span>
                                ${estr ? '<span style="font-size:0.7em;color:#a855f7">' + estr + '</span>' : ''}
                                <span class="jogo-data">${data}</span>
                                <span class="jogo-conf">Conf: ${conf}%</span>
                            </div>`;

                            html += `<div class="numeros-row">
                                <div class="numeros-label">Seus numeros</div>
                                <div class="numeros-list">${nums.map(n =>
                                    `<span class="${numsSet.has(n) && info.sorteio.includes(n) ? 'num-acerto' : 'num-erro'}">${String(n).padStart(2, '0')}</span>`
                                ).join('')}</div>
                            </div>`;

                            html += `<div class="numeros-row">
                                <div class="numeros-label">Numeros sorteados</div>
                                <div class="numeros-list">${info.sorteio.map(n =>
                                    `<span class="${numsSet.has(n) ? 'num-drawn' : 'num-nao-drawn'}">${String(n).padStart(2, '0')}</span>`
                                ).join('')}</div>
                            </div>`;

                            html += `<div class="resultado-acertos">
                                <span class="acerto-count acerto-${acertos}">${acertos} acerto${acertos !== 1 ? 's' : ''}</span>
                                ${acertados.length ? '<span class="acerto-label">Acertou: ' + acertados.map(n => String(n).padStart(2, '0')).join(', ') + '</span>' : ''}
                                ${errados.length ? '<span class="acerto-label" style="color:#ff6b6b">Errou: ' + errados.map(n => String(n).padStart(2, '0')).join(', ') + '</span>' : ''}
                            </div>`;

                            html += `</div>`;
                        }
                        html += `</div>`;
                    }
                    html += `</div>`;
                }

                if (pendentesLista.length) {
                    const pendGroups = {};
                    for (const p of pendentesLista) {
                        const fonte = p.fonte || 'Outro';
                        if (!pendGroups[fonte]) pendGroups[fonte] = [];
                        pendGroups[fonte].push(p);
                    }

                    for (const [fonte, jogos] of Object.entries(pendGroups)) {
                        const fonteCls = 'fonte-' + fonte.replace(/\s+/g, '');
                        html += `<div class="concurso-group">
                            <div class="concurso-title" style="border-left-color:#ffc107">
                                <span><span class="fonte-badge ${fonteCls}">${fonte}</span></span>
                                <span style="color:#888;font-size:0.85em">${jogos.length} jogo(s) aguardando</span>
                            </div>`;
                        for (const p of jogos) {
                            const nums = p.numeros || [];
                            const conf = typeof p.confianca === 'number' ? p.confianca.toFixed(1) : (p.confianca || '—');
                            const data = new Date(p.data).toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
                            const id = p.id || '—';
                            const concurso = p.concurso_criacao || '—';

                            html += `<div class="jogo-card" style="opacity:0.7">
                                <div class="jogo-header">
                                    <span class="jogo-id">#${id}</span>
                                    <span class="fonte-badge ${fonteCls}">${fonte}</span>
                                    <span class="jogo-data">${data}</span>
                                    <span class="jogo-conf">Conf: ${conf}%</span>
                                    <span style="font-size:0.75em;color:#888">Concurso: ${concurso}</span>
                                </div>
                                <div class="numeros-row">
                                    <div class="numeros-label">Seus numeros</div>
                                    <div class="numeros-list">${nums.map(n =>
                                        `<span class="num-nao-drawn">${String(n).padStart(2, '0')}</span>`
                                    ).join('')}</div>
                                </div>
                                <div class="pendente-label"><i class="fas fa-clock"></i> Aguardando resultado do Concurso #${concurso}</div>
                            </div>`;
                        }
                        html += `</div>`;
                    }
                }
            }
            html += `</div></div>`;
        }
        container.innerHTML = html;
    }

    function toggleSection(id) {
        const el = document.getElementById(id);
        if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }

    async function verificarAgora() {
        const btn = document.querySelector('.btn-verificar');
        if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verificando...'; }
        try {
            const resp = await fetch('/api/verificar-resultados', { method: 'POST' });
            const r = await resp.json();
            await carregar();
        } catch(e) {
            alert('Erro ao verificar: ' + e.message);
        }
        if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-sync-alt"></i> Verificar Agora'; }
    }

    document.addEventListener('DOMContentLoaded', () => {
        verificarAgora();
    });
    </script>
</body>
</html>
